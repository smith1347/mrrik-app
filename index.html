<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MRRIK Trading AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0d0d0d; --bg2: #111111; --bg3: #181818; --bg4: #1e1e1e;
    --border: #222222; --orange: #e85d04; --orange2: #ff6b1a;
    --orange-dim: rgba(232,93,4,0.12); --text: #ffffff; --text2: #aaaaaa;
    --text3: #555555; --green: #22c55e; --green-dim: rgba(34,197,94,0.12);
    --red: #ef4444; --red-dim: rgba(239,68,68,0.12);
    --purple: #a78bfa; --purple-dim: rgba(167,139,250,0.12);
    --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  .topbar { background: var(--bg2); border-bottom: 0.5px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .logo { width: 34px; height: 34px; border-radius: 50%; background: var(--orange); overflow: hidden; flex-shrink: 0; }
  .topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .topbar-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);} }
  .screen { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  .screen::-webkit-scrollbar { display: none; }
  .balance-card { background: var(--bg2); padding: 20px 16px 16px; text-align: center; border-bottom: 0.5px solid var(--border); }
  .bal-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .bal-amount { font-size: 36px; font-weight: 700; color: var(--text); letter-spacing: -1px; }
  .bal-change { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; border-radius: 20px; padding: 3px 10px; border: 0.5px solid; }
  .bal-change span { font-size: 12px; font-weight: 500; }
  .bal-change.pos { background: var(--green-dim); border-color: rgba(34,197,94,0.2); }
  .bal-change.pos span { color: var(--green); }
  .bal-change.neg { background: var(--red-dim); border-color: rgba(239,68,68,0.2); }
  .bal-change.neg span { color: var(--red); }
  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--bg2); border-bottom: 0.5px solid var(--border); }
  .stat-item { padding: 12px 8px; text-align: center; border-right: 0.5px solid var(--border); }
  .stat-item:last-child { border-right: none; }
  .stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .stat-value { font-size: 18px; font-weight: 600; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.orange { color: var(--orange); }
  .section { padding: 14px 16px 0; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .section-title { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .section-title::before { content: ''; display: block; width: 3px; height: 11px; border-radius: 2px; background: linear-gradient(180deg, var(--orange2), var(--orange)); flex-shrink: 0; }
  .stat-icon { width: 20px; height: 20px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; background: var(--orange-dim); color: var(--orange); flex-shrink: 0; }
  .section-action { font-size: 11px; color: var(--orange); cursor: pointer; }
  .trade-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; transition: background 0.15s; }
  .trade-card:active { background: var(--bg3); }
  .trade-coin { font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .badge { font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.3px; }
  .badge.long { background: var(--green-dim); color: var(--green); border: 0.5px solid rgba(34,197,94,0.2); }
  .badge.short { background: var(--red-dim); color: var(--red); border: 0.5px solid rgba(239,68,68,0.2); }
  .trade-detail { font-size: 11px; color: var(--text3); margin-top: 3px; }
  .trade-pnl { font-size: 14px; font-weight: 600; text-align: right; }
  .trade-pnl.pos { color: var(--green); }
  .trade-pnl.neg { color: var(--red); }
  .trade-pct { font-size: 11px; color: var(--text3); margin-top: 2px; text-align: right; }
  .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .ctrl-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 13px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.15s; }
  .ctrl-card:active { background: var(--bg3); transform: scale(0.97); }
  .ctrl-icon { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .ctrl-icon.orange { background: var(--orange-dim); color: var(--orange); }
  .ctrl-icon.green { background: var(--green-dim); color: var(--green); }
  .ctrl-icon.blue { background: rgba(96,165,250,0.12); color: #60a5fa; }
  .ctrl-icon.purple { background: var(--purple-dim); color: var(--purple); }
  .ctrl-icon.red { background: var(--red-dim); color: var(--red); }
  .ctrl-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .ctrl-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .risk-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 8px; }
  .risk-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
  .risk-btns { display: flex; gap: 6px; }
  .risk-btn { flex: 1; padding: 8px 4px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: transparent; color: var(--text3); font-size: 12px; font-weight: 500; cursor: pointer; text-align: center; transition: all 0.2s; }
  .risk-btn.active { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); }
  .risk-desc { font-size: 11px; color: var(--text3); margin-top: 8px; line-height: 1.5; }
  .demo-banner { background: var(--purple-dim); border: 0.5px solid rgba(167,139,250,0.25); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: background 0.15s; }
  .demo-banner:active { background: rgba(167,139,250,0.2); }
  .demo-left { display: flex; align-items: center; gap: 10px; }
  .demo-title { font-size: 13px; font-weight: 500; color: var(--purple); }
  .demo-sub { font-size: 11px; color: rgba(167,139,250,0.5); margin-top: 1px; }
  .bottom-nav { background: var(--bg2); border-top: 0.5px solid var(--border); display: flex; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); flex-shrink: 0; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 0; opacity: 0.35; transition: opacity 0.2s; position: relative; -webkit-tap-highlight-color: transparent; }
  .nav-item.active { opacity: 1; }
  .nav-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
  .nav-icon svg { transition: transform 0.2s ease; }
  .nav-item.active .nav-icon svg .nav-svg-stroke { stroke: var(--orange); }
  .nav-item.active .nav-icon svg .nav-svg-fill { fill: var(--orange); }
  .nav-item:not(.active) .nav-icon svg .nav-svg-stroke { stroke: #555; }
  .nav-item:not(.active) .nav-icon svg .nav-svg-fill { fill: #555; }
  .nav-label { font-size: 9px; color: #555; font-weight: 500; transition: color 0.2s; }
  .nav-item.active .nav-label { color: var(--orange); }
  /* Tap bounce animation */
  @keyframes navBounce { 0%{transform:scale(1)} 40%{transform:scale(1.25)} 70%{transform:scale(0.92)} 100%{transform:scale(1)} }
  @keyframes navRipple { 0%{transform:scale(0.3);opacity:0.5} 100%{transform:scale(2.2);opacity:0} }
  .nav-icon.bouncing svg { animation: navBounce 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards; }
  .nav-ripple { position: absolute; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle, rgba(232,93,4,0.35) 0%, rgba(232,93,4,0) 70%); pointer-events: none; animation: navRipple 0.5s ease-out forwards; top: 50%; left: 50%; margin-top: -18px; margin-left: -18px; z-index: 0; }
  /* Active indicator dot */
  .nav-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--orange); margin-top: 1px; opacity: 0; transition: opacity 0.2s; box-shadow: 0 0 6px rgba(232,93,4,0.6); }
  .nav-item.active .nav-dot { opacity: 1; }
  .pill { display: inline-block; font-size: 10px; padding: 3px 8px; border-radius: 20px; font-weight: 500; }
  .pill.active { background: var(--green-dim); color: var(--green); border: 0.5px solid rgba(34,197,94,0.2); }
  .pill.paused { background: rgba(234,179,8,0.12); color: #eab308; border: 0.5px solid rgba(234,179,8,0.2); }
  .pill.inactive { background: var(--red-dim); color: var(--red); border: 0.5px solid rgba(239,68,68,0.2); }
  .input-row { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 8px; }
  .input-lbl { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
  .amount-display { display: flex; align-items: baseline; gap: 6px; }
  .amount-curr { font-size: 20px; color: var(--text3); }
  .amount-val { font-size: 32px; font-weight: 600; color: var(--text); letter-spacing: -1px; }
  .amount-btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .amount-btn { padding: 7px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: var(--bg3); color: var(--text2); font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .amount-btn:active { background: var(--orange-dim); border-color: var(--orange); color: var(--orange); }
  .amount-btn.active { background: rgba(167,139,250,0.15); border-color: var(--purple); color: var(--purple); font-weight: 600; }
  .demo-bal-card { background: var(--purple-dim); border: 0.5px solid rgba(167,139,250,0.25); border-radius: var(--radius); padding: 16px; margin-bottom: 8px; text-align: center; }
  .demo-bal-label { font-size: 11px; color: rgba(167,139,250,0.6); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
  .demo-bal-amount { font-size: 28px; font-weight: 600; color: var(--purple); }
  .demo-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .demo-stat { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px; text-align: center; }
  .demo-stat-l { font-size: 10px; color: var(--text3); margin-bottom: 3px; }
  .demo-stat-v { font-size: 16px; font-weight: 600; color: var(--text); }
  .settings-group { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border-bottom: 0.5px solid var(--border); cursor: pointer; transition: background 0.15s; }
  .settings-row:last-child { border-bottom: none; }
  .settings-row:active { background: var(--bg3); }
  .settings-row-left { display: flex; align-items: center; gap: 10px; }
  .settings-row-icon { width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .trade-hist { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border-bottom: 0.5px solid var(--border); }
  .trade-hist:last-child { border-bottom: none; }
  .hist-coin { font-size: 13px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .hist-date { font-size: 10px; color: var(--text3); margin-top: 2px; }
  .hist-pnl { font-size: 13px; font-weight: 600; text-align: right; }
  .hist-pnl.win { color: var(--green); }
  .hist-pnl.loss { color: var(--red); }
  .hist-pct { font-size: 10px; color: var(--text3); margin-top: 2px; text-align: right; }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg3); border: 0.5px solid var(--border); border-radius: 20px; padding: 8px 16px; font-size: 13px; color: var(--text); opacity: 0; transition: all 0.3s; white-space: nowrap; z-index: 999; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* ── 1. SKELETON LOADING ── */
  @keyframes shimmer { 0%{background-position:-300px 0} 100%{background-position:300px 0} }
  .skel { background: linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%); background-size: 600px 100%; animation: shimmer 1.4s infinite linear; border-radius: 6px; }
  .skel-line { height: 12px; margin-bottom: 8px; }
  .skel-circle { border-radius: 50%; }
  .skel-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 8px; }

  /* ── 2. TAB SLIDE TRANSITIONS ── */
  @keyframes slideInLeft  { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:translateX(0)} }
  @keyframes slideInRight { from{opacity:0;transform:translateX(-40px)} to{opacity:1;transform:translateX(0)} }
  @keyframes slideOutLeft  { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(-30px)} }
  @keyframes slideOutRight { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(30px)} }
  .slide-in-left  { animation: slideInLeft  0.22s cubic-bezier(0.25,0.46,0.45,0.94) forwards; }
  .slide-in-right { animation: slideInRight 0.22s cubic-bezier(0.25,0.46,0.45,0.94) forwards; }
  .slide-out-left  { animation: slideOutLeft  0.14s cubic-bezier(0.4,0,1,1) forwards; }
  .slide-out-right { animation: slideOutRight 0.14s cubic-bezier(0.4,0,1,1) forwards; }

  /* ── 3. TRADE STATUS COLOR BARS ── */
  .trade-card { position: relative; overflow: hidden; }
  .trade-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:3px 0 0 3px; }
  .trade-card.status-open::before    { background: #60a5fa; }
  .trade-card.status-profit::before  { background: var(--green); }
  .trade-card.status-loss::before    { background: var(--red); }
  .trade-card.status-neutral::before { background: var(--orange); }

  /* ── 4. ANIMATED COUNTER ── */
  @keyframes countUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .count-anim { animation: countUp 0.5s ease forwards; }
  /* MARKET WIDGET */
  @keyframes fngSweep { from { transform: rotate(-90deg); } to { transform: rotate(0deg); } }
  .fng-needle { transform-box: fill-box; transform-origin: 50% 50%; animation: fngSweep 1.15s cubic-bezier(.34,1.3,.5,1) both; }
  /* PRO GAUGE: needle is drawn at its true angle; the animation only sweeps
     it in from 0 around the real hub (170,150), so it is correct even if the
     animation never runs. */
  .fg2-wrap { margin: -4px -6px 0; padding: 4px 6px 2px; border-radius: 12px; }
  .fg2-needle { transform-box: view-box; transform-origin: 170px 150px;
                animation: fg2Sweep 1.3s cubic-bezier(.22,1,.36,1) both; }
  @keyframes fg2Sweep { from { transform: rotate(var(--fg2-from)); } to { transform: rotate(0deg); } }
  .fg2-num { text-align:center; font-size:52px; font-weight:800; line-height:1; margin-top:2px;
             font-variant-numeric: tabular-nums; letter-spacing:-1px; animation: fngPop .7s cubic-bezier(.2,1.3,.4,1) both; }
  .fg2-lbl { text-align:center; font-size:13px; font-weight:800; letter-spacing:2.2px; text-transform:uppercase; margin-top:6px; }
  /* living background: slow aurora wash + drifting dots in the band colour */
  .fng-wrap { position: relative; overflow: hidden; border-radius: 10px; margin: -16px -16px -18px; padding: 16px 16px 18px; }
  .fng-bgfx { position:absolute; inset:-40%; pointer-events:none; opacity:.5;
              background: radial-gradient(closest-side, var(--fc) 0%, transparent 62%);
              filter: blur(26px); animation: fngDrift 17s ease-in-out infinite; }
  @keyframes fngDrift {
    0%,100% { transform: translate(-14%, 6%)  scale(1);    opacity:.34; }
    33%     { transform: translate(12%, -8%)  scale(1.18); opacity:.5; }
    66%     { transform: translate(6%, 10%)   scale(.92);  opacity:.28; }
  }
  .fng-dots { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .fng-dot { position:absolute; border-radius:50%; opacity:0;
             animation: fngFloat 9s ease-in-out infinite; will-change: transform, opacity; }
  @keyframes fngFloat {
    0%   { transform: translateY(10px)  scale(.5); opacity:0; }
    22%  { opacity:.85; }
    60%  { opacity:.55; }
    100% { transform: translateY(-42px) scale(1.15); opacity:0; }
  }
  .fng-halo { position:absolute; left:50%; top:30px; width:158px; height:158px; margin-left:-79px;
              border-radius:50%; pointer-events:none; animation: fngBreathe 5.5s ease-in-out infinite; }
  @keyframes fngBreathe { 0%,100%{transform:scale(1);opacity:.85} 50%{transform:scale(1.1);opacity:1} }
  .fng-ping { transform-box: fill-box; transform-origin: 50% 50%; animation: fngPing 2.8s ease-out infinite; }
  @keyframes fngPing { 0%{transform:scale(1);opacity:.7} 70%{transform:scale(1.75);opacity:0} 100%{opacity:0} }
  .fng-arcs path { animation: fngArcIn .8s ease-out both; }
  @keyframes fngArcIn { from { opacity:0 } to { opacity:1 } }
  .fng-num { font-size:42px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums;
             animation: fngPop .7s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes fngPop { from{transform:scale(.72);opacity:0} to{transform:scale(1);opacity:1} }
  .fng-trend-h { display:flex; justify-content:space-between; align-items:baseline; margin:16px 2px 6px;
                 font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text3); }
  .fng-bars { display:flex; align-items:flex-end; gap:2px; height:34px; padding:0 1px; }
  .fng-bar { flex:1; border-radius:2px 2px 0 0; transform-origin:bottom; opacity:.9;
             animation: fngBarUp .5s cubic-bezier(.2,1,.4,1) both; }
  @keyframes fngBarUp { from{transform:scaleY(0);opacity:0} to{transform:scaleY(1);opacity:.9} }
  @media (prefers-reduced-motion: reduce) {
    .fng-needle, .fng-bgfx, .fng-dot, .fng-halo, .fng-ping,
    .fng-arcs path, .fng-num, .fng-bar, .fg2-needle, .fg2-num { animation: none; }
    .fng-dot { opacity:.5; }
  }
  .mk-head { display:flex; align-items:center; justify-content:space-between; margin: 26px 2px 10px; }
  .mk-thead { display:flex; align-items:center; gap:11px; padding:9px 13px; font-size:9.5px; font-weight:600;
              letter-spacing:.07em; text-transform:uppercase; color:var(--text3);
              background:rgba(255,255,255,.022); border-bottom:0.5px solid var(--border); }
  .mk-logo { position:relative; width:28px; height:28px; flex:0 0 28px; border-radius:50%;
             background:var(--bg3); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .mk-logo span { font-size:11px; font-weight:700; color:var(--text3); }
  .mk-logo img { position:absolute; inset:0; width:100%; height:100%; border-radius:50%; opacity:0; transition:opacity .25s; }
  .mk-spark { flex:0 0 54px; width:54px; height:26px; opacity:.95; }
  .mk-sent { margin-top:14px; padding:11px 12px; border-radius:10px; border:1px solid;
             background:rgba(255,255,255,.025); }
  .mk-sent-h { display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
               letter-spacing:.3px; margin-bottom:5px; }
  .mk-sent-b { font-size:11.5px; line-height:1.5; color:var(--text2); }
  .mk-age { display:flex; align-items:center; gap:5px; font-size:10px; color: var(--text3); }
  .mk-dot { width:5px; height:5px; border-radius:50%; display:inline-block; background: var(--text3); }
  .mk-live { background:#16c784; box-shadow:0 0 6px #16c784; animation: mkPulse 2.2s ease-in-out infinite; }
  @keyframes mkPulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .mk-card { background: linear-gradient(180deg, rgba(255,145,77,.035), rgba(255,145,77,0) 90px), var(--bg2);
             border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  /* HOME HEADER: getting-started card, same living-background technique as
     the Fear & Greed gauge, reusing fngDots() in the brand orange. */
  /* DERIVS */
  .fr-strip { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px;

  .ptr-indicator { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 70px; gap: 8px; transform: translateY(-70px); transition: transform 0.25s ease; pointer-events: none; z-index: 10; }

  .ptr-candle1 { position:absolute; left:4px; bottom:4px; width:7px; border-radius:2px; background:var(--orange); opacity:0.7; }
  .ptr-candle2 { position:absolute; right:4px; top:4px; width:7px; border-radius:2px; background:var(--orange); }
  .ptr-wick1 { position:absolute; left:7px; bottom:0; width:1.5px; background:var(--orange); opacity:0.7; }
  .ptr-wick1b { position:absolute; left:7px; background:var(--orange); width:1.5px; opacity:0.7; }
  .ptr-wick2 { position:absolute; right:7px; top:0; width:1.5px; background:var(--orange); }

  .rf-av { position:relative; flex:0 0 36px; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#fff; }
  .rf-dot { position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border-radius:50%; border:2px solid var(--bg2); }
  .rf-nm { font-size:13px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

</style>

<script>
// ── Telegram Mini App init ──────────────────────────
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#111111'); tg.setBackgroundColor('#0d0d0d'); }

const API_BASE = 'https://mrrik.duckdns.org';
const BOT_USERNAME = 'TBARMENIABot';

function getUserId() {
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) return tg.initDataUnsafe.user.id;
  return new URLSearchParams(window.location.search).get('user_id') || null;
}

// ── State ───────────────────────────────────────────
let USER     = null;   // /api/user response
let STATS    = null;   // /api/stats  — real trade stats
let REAL_TRADES  = []; // /api/real_trades
let DEMO_TRADES  = [];
let OPEN_DEMO    = [];   // all open demo trades (no limit)
let CLOSED_DEMO  = [];   // recent closed demo trades // /api/demo_trades
let USER_ID  = null;
let currentTab = 'home';
let showAllOpen   = false;  // toggle for open demo trades list
let showAllClosed = false;  // toggle for demo history list
// Demo history sort/filter. Kept in module state so the choice survives the
// re-render that goTo() triggers.
let histSort   = 'newest';  // newest | oldest | profit | loss
let histFilter = 'all';     // all | wins | losses
// REFERRAL: partner program card (Settings). null = not loaded yet -> no card.
let MYREF = null;
let refShowAll = false;
let LAST_LOAD = 0;   // SETTINGS ROWS

// ── Formatters ──────────────────────────────────────
function fmt(n)  { return Math.abs(parseFloat(n)).toFixed(2); }
function fmtB(n) { return parseFloat(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
// ADMIN TOOLS: escape admin-authored text before it goes into innerHTML.
// close_reason is typed by a human in the admin panel, so it must never be
// interpolated raw into a template literal.
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
// USER INFO: turn joined_date ('YYYY-MM-DD HH:MM') into a readable date plus
// an elapsed-time phrase. Written as two separate values so the card can show
// "04 Jun 2026" and "3 months" without re-parsing.
function memberSince(raw) {
  if (!raw) return { date: '\u2014', elapsed: '\u2014', days: 0 };
  // Space -> T so iOS/Safari parses it; without this every date is Invalid.
  const d = new Date(String(raw).replace(' ', 'T'));
  if (isNaN(d)) return { date: '\u2014', elapsed: '\u2014', days: 0 };
  const days = Math.max(0, Math.floor((Date.now() - d) / 86400000));
  let elapsed;
  if (days === 0)      elapsed = 'Joined today';
  else if (days === 1) elapsed = '1 day';
  else if (days < 30)  elapsed = days + ' days';
  else if (days < 60)  elapsed = '1 month';
  else if (days < 365) elapsed = Math.floor(days / 30) + ' months';
  else {
    const y = Math.floor(days / 365), m = Math.floor((days % 365) / 30);
    elapsed = y + (y === 1 ? ' year' : ' years') + (m ? ' ' + m + 'm' : '');
  }
  return {
    date: d.toLocaleDateString('en-US', { day:'2-digit', month:'short', year:'numeric' }),
    elapsed, days
  };
}

// USER INFO: copy text to the clipboard. Telegram's WebView does not always
// expose navigator.clipboard, so fall back to a hidden textarea + execCommand.
function copyText(txt, label) {
  const done = () => {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    showToast((label || 'Copied') + ' copied');
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
    } else fallbackCopy(txt, done);
  } catch (e) { fallbackCopy(txt, done); }
}
function fallbackCopy(txt, done) {
  try {
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    done();
  } catch (e) { showToast('Could not copy'); }
}

// ╔═══════════════════════════════════════════════════════════════════╗
// ║  MARKET WIDGET — top 10 coins + fear & greed, bottom of Home.     ║
// ║  Loaded SEPARATELY from the main payload on purpose: it must      ║
// ║  never be able to break the Home page. See loadMarket().          ║
// ╚═══════════════════════════════════════════════════════════════════╝
let MARKET = null;
let marketShowAll = false;

function fngColor(v) {
  // Matches the colour the continuous arc actually shows at each band.
  if (v < 25) return '#ff3b3b';
  if (v < 45) return '#ff8c1a';
  if (v < 55) return '#ffd23a';
  if (v < 75) return '#2fd46a';
  return '#12d67e';
}
function fngBand(v) {
  if (v < 25) return 'Extreme fear';
  if (v < 45) return 'Fear';
  if (v < 55) return 'Neutral';
  if (v < 75) return 'Greed';
  return 'Extreme greed';
}
function fngNote(v) {
  // Describes what the reading means, without telling anyone what to do.
  if (v < 25) return 'Extreme fear. Sentiment is heavily negative and volatility is usually elevated.';
  if (v < 45) return 'Fear is leading the market. Sellers have been more active than buyers.';
  if (v < 55) return 'Neutral. Buying and selling pressure are close to balanced.';
  if (v < 75) return 'Greed is leading the market. Sentiment is positive, and moves can overextend.';
  return 'Extreme greed. Sentiment is stretched and reversals are more common at these levels.';
}
function fmtPrice(p) {
  const n = Number(p);
  if (!isFinite(n)) return '\u2014';
  if (n >= 1000) return n.toLocaleString('en-US', {maximumFractionDigits: 0});
  if (n >= 1)    return n.toFixed(2);
  if (n >= 0.01) return n.toFixed(4);
  return n.toFixed(6);
}
function fmtAge(sec) {
  if (sec == null) return '';
  if (sec < 60)   return sec + 's ago';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
  return Math.floor(sec / 3600) + 'h ago';
}

// The needle angle is baked into the markup as a real transform attribute,
// and the number is printed at its true value. An earlier version set both
// from JS after render -- but every 60s poll re-rendered Home inline without
// re-running that JS, so the gauge reset to 0 and the needle pointed straight
// up. Correct-without-JS is the fix; the sweep animation is now decoration
// layered on top, and if it never runs the reading is still right.
// Every animation here is pure CSS. renderHome() re-paints this block every
// 60s, so a JS-driven loop would either die on re-render or leak a second
// rAF each time. CSS keyframes restart cleanly on every paint and cost
// nothing when the tab is backgrounded.
function fngDots(col) {
  // Deterministic positions -- Math.random() would make every dot jump to a
  // new spot on each 60s re-render, which reads as flicker rather than drift.
  const P = [[8,72,7,0],[19,34,4,1.6],[31,84,5,3.1],[43,22,6,0.7],[52,62,3,2.4],
             [63,40,7,4.2],[74,78,4,1.1],[86,30,5,3.6],[93,66,6,2.0],[26,56,4,5.0],
             [57,16,5,1.3],[81,52,3,4.6],[14,48,5,2.8],[68,88,4,0.4]];
  return P.map(([x, y, d, delay]) => `<i class="fng-dot" style="left:${x}%;top:${y}%;width:${d}px;height:${d}px;background:${col};animation-delay:${delay}s"></i>`).join('');
}

function fngTrend(hist, col) {
  if (!hist || hist.length < 2) return '';
  const h = hist.slice(-30);
  const first = h[0], last = h[h.length - 1];
  const diff = last - first;
  const dir = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
  const bars = h.map((v, i) => `<i class="fng-bar" style="height:${Math.max(8, v)}%;background:${fngColor(v)};animation-delay:${(i * 0.022).toFixed(3)}s"></i>`).join('');
  return `
    <div class="fng-trend-h">
      <span>30-day trend</span>
      <span style="color:${dir === 'up' ? '#16c784' : dir === 'down' ? '#ff4d4d' : 'var(--text3)'}">
        ${dir === 'flat' ? 'unchanged' : (diff > 0 ? '+' : '') + diff + ' pts'}
      </span>
    </div>
    <div class="fng-bars">${bars}</div>`;
}

// PRO GAUGE: continuous gradient arc, inner ticks, band labels, tapered
// glowing needle. Geometry and needle angle are baked into the markup, so
// the reading is correct even if the sweep animation never runs.
function fngGauge(v, label, hist) {
  const val = Math.max(0, Math.min(100, Math.round(Number(v) || 0)));
  const col = fngColor(val);
  const CX = 170, CY = 150, R = 110;
  const rad = (vv) => (180 - vv * 1.8) * Math.PI / 180;
  const pt  = (vv, r) => [(CX + r * Math.cos(rad(vv))).toFixed(1), (CY - r * Math.sin(rad(vv))).toFixed(1)];
  const arc = (r) => `M ${CX - r} ${CY} A ${r} ${r} 0 0 1 ${CX + r} ${CY}`;

  let ticks = '';
  for (let t = 0; t <= 100; t += 5) {
    const major = t % 25 === 0;
    const [x1, y1] = pt(t, 97), [x2, y2] = pt(t, major ? 86 : 91);
    ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(255,255,255,${major ? .38 : .15})" stroke-width="${major ? 1.4 : 1}" stroke-linecap="round"/>`;
  }
  let seps = '';
  for (const b of [25, 45, 55, 75]) {
    const [x1, y1] = pt(b, R - 9), [x2, y2] = pt(b, R + 9);
    seps += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#0b0b0b" stroke-width="2.4"/>`;
  }
  const [mx1, my1] = pt(val, R - 8), [mx2, my2] = pt(val, R + 8);

  // tapered needle: tip, two base shoulders at the hub, short tail behind it
  const t = rad(val), p = t + Math.PI / 2;
  const [tx, ty] = pt(val, 84);
  const b1 = [(CX + 3.4 * Math.cos(p)).toFixed(1), (CY - 3.4 * Math.sin(p)).toFixed(1)];
  const b2 = [(CX - 3.4 * Math.cos(p)).toFixed(1), (CY + 3.4 * Math.sin(p)).toFixed(1)];
  const tl = [(CX - 12 * Math.cos(t)).toFixed(1), (CY + 12 * Math.sin(t)).toFixed(1)];

  const band = val < 25 ? 0 : val < 45 ? 1 : val < 55 ? 2 : val < 75 ? 3 : 4;
  const lc = (i) => i === band ? col : '#7d7d7d';
  const lw = (i) => i === band ? 700 : 600;
  const [fx, fy] = pt(22, R + 24), [nx, ny] = pt(50, R + 24), [gx, gy] = pt(78, R + 24);
  const L = (x, y, anchor, i, txt) =>
    `<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${lc(i)}" font-size="9.5" font-weight="${lw(i)}" letter-spacing="1.1">${txt}</text>`;

  return `
  <div class="fg2-wrap" style="background:radial-gradient(ellipse 70% 60% at 50% 72%, ${col}24 0%, transparent 70%)">
    <svg viewBox="-16 0 372 172" width="100%" style="display:block;overflow:visible" role="img"
         aria-label="Fear and greed index ${val} out of 100, ${esc(label || fngBand(val))}">
      <defs>
        <linearGradient id="fg2Arc" gradientUnits="userSpaceOnUse" x1="${CX - R}" y1="0" x2="${CX + R}" y2="0">
          <stop offset="0"    stop-color="#ff2e2e"/>
          <stop offset="0.2"  stop-color="#ff5a1f"/>
          <stop offset="0.38" stop-color="#ff9a1f"/>
          <stop offset="0.5"  stop-color="#ffd23a"/>
          <stop offset="0.64" stop-color="#b8e23a"/>
          <stop offset="0.82" stop-color="#3fdc5c"/>
          <stop offset="1"    stop-color="#12c76a"/>
        </linearGradient>
        <linearGradient id="fg2Needle" gradientUnits="userSpaceOnUse" x1="${CX}" y1="${CY}" x2="${tx}" y2="${ty}">
          <stop offset="0" stop-color="${col}"/><stop offset="1" stop-color="#ffffff"/>
        </linearGradient>
        <filter id="fg2Glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="fg2Blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>
      <path d="${arc(R + 16)}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
      <path d="${arc(R)}" fill="none" stroke="url(#fg2Arc)" stroke-width="15" opacity=".5" filter="url(#fg2Blur)"/>
      <path d="${arc(R)}" fill="none" stroke="url(#fg2Arc)" stroke-width="15"/>
      ${seps}
      ${ticks}
      <line x1="${mx1}" y1="${my1}" x2="${mx2}" y2="${my2}" stroke="#fff" stroke-width="3" stroke-linecap="round" filter="url(#fg2Glow)"/>
      ${L(44, 118, 'end', 0, 'EXTREME')}${L(44, 130, 'end', 0, 'FEAR')}
      ${L(fx, fy, 'middle', 1, 'FEAR')}
      ${L(nx, ny, 'middle', 2, 'NEUTRAL')}
      ${L(gx, gy, 'middle', 3, 'GREED')}
      ${L(296, 118, 'start', 4, 'EXTREME')}${L(296, 130, 'start', 4, 'GREED')}
      <g class="fg2-needle" style="--fg2-from:${-(val * 1.8)}deg">
        <polygon points="${tx},${ty} ${b1[0]},${b1[1]} ${tl[0]},${tl[1]} ${b2[0]},${b2[1]}" fill="url(#fg2Needle)" filter="url(#fg2Glow)"/>
      </g>
      <circle cx="${CX}" cy="${CY}" r="15" fill="#0c0c0c" stroke="${col}" stroke-width="2.2" filter="url(#fg2Glow)"/>
      <circle cx="${CX}" cy="${CY}" r="9.5" fill="none" stroke="${col}" stroke-opacity=".35" stroke-width="1"/>
      <circle cx="${CX}" cy="${CY}" r="4.6" fill="#ffffff"/>
    </svg>

// A 7d sparkline drawn from the points the backend already caches. Coloured
// by the direction of the whole week, which is often not the same sign as the
// 24h change -- that contrast is the point of showing both.
function sparkPath(spark, w, h) {
  if (!spark || spark.length < 2) return null;
  const lo = Math.min(...spark), hi = Math.max(...spark);
  const span = (hi - lo) || 1;
  const pad = 2;
  const pts = spark.map((v, i) => {
    const x = (i / (spark.length - 1)) * w;
    const y = h - pad - ((v - lo) / span) * (h - pad * 2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  });
  return { line: pts.join(' '), up: spark[spark.length - 1] >= spark[0] };
}

function coinLogo(c) {
  // The logo is decorative. If CoinGecko's CDN is slow or blocked the <img>
  // is hidden and the lettered fallback underneath shows instead, so a row
  // never collapses into a broken-image icon.
  const letter = esc((c.symbol || '?').slice(0, 1));
  const src = c.image ? esc(c.image) : '';
  return `<div class="mk-logo"><span>${letter}</span>${src
    ? `<img src="${src}" alt="" loading="lazy" onload="this.style.opacity=1" onerror="this.remove()">` : ''}</div>`;
}

// DERIVS: funding is a fraction per funding interval. Colour follows the
// sign because that is what it means: positive = longs pay shorts (crowded
// longs), negative = shorts pay longs.
function fundColor(v) {
  if (v == null) return 'var(--text3)';
  if (v > 0.03)  return '#ff4d4d';
  if (v > 0)     return '#ff9f2e';
  if (v === 0)   return 'var(--text3)';
  if (v > -0.03) return '#8fd14f';
  return '#16c784';
}
function fmtCountdown(ms) {
  if (!ms) return '';
  const d = ms - Date.now();
  if (d <= 0) return 'due';
  const h = Math.floor(d / 3600000), m = Math.floor((d % 3600000) / 60000);
  return h > 0 ? h + 'h ' + m + 'm' : m + 'm';
}
function fmtUsdShort(v) {
  // Number(null) is 0, which is finite -- so a missing value would print as
  // "$0" and read as a real reading of zero open interest. Reject null and
  // empty string explicitly before converting.
  if (v == null || v === '') return '\u2014';
  const n = Number(v);
  if (!isFinite(n)) return '\u2014';
  const a = Math.abs(n);
  if (a >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
  if (a >= 1e3) return '$' + (n / 1e3).toFixed(0) + 'K';
  return '$' + n.toFixed(0);
}

// Short date like "Dec 15"; the year is added only when it isn't this year.
function refShort(s) {
  if (!s) return '';
  const d = new Date(String(s).slice(0, 10) + 'T00:00:00');
  if (isNaN(d)) return esc(s);
  const o = { month:'short', day:'numeric' };
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('en-US', o);
}
// "Joined today / yesterday / 3 days ago", then a plain date after a week.
function refJoined(s) {
  if (!s) return 'Joined \u2014';
  const d = new Date(String(s).slice(0, 10) + 'T00:00:00');
  if (isNaN(d)) return 'Joined ' + esc(s);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const days = Math.round((t - d) / 86400000);
  if (days <= 0) return 'Joined today';
  if (days === 1) return 'Joined yesterday';
  if (days < 7)  return 'Joined ' + days + ' days ago';
  return 'Joined ' + refShort(s);
}
function refInitial(r) {
  const src = (r.username || r.full_name || '').trim();
  const ch = Array.from(src)[0] || '';
  return /\p{L}|\p{N}/u.test(ch) ? ch.toUpperCase() : '?';
}

// Count-up / ring sweep / bar fill. The final values are already in the
// markup, so if this never runs (old WebView, reduced motion) the card is
// simply shown static and correct -- animation can never leave a wrong number.
let refSkipAnim = false;
function refAnimate() {
  if (refSkipAnim) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const slot = document.getElementById('ref-slot');
  if (!slot) return;
  const ease = t => 1 - Math.pow(1 - t, 3);
  slot.querySelectorAll('[data-rf-count]:not([data-rf-done])').forEach(el => {
    el.setAttribute('data-rf-done', '1');
    const target = Number(el.getAttribute('data-rf-count')) || 0;
    const suffix = el.getAttribute('data-rf-suffix') || '';
    if (target <= 0) return;
    const t0 = performance.now(), dur = 900;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      el.textContent = Math.round(target * ease(p)) + suffix;
      if (p < 1) requestAnimationFrame(step);
    };
    el.textContent = '0' + suffix;
    requestAnimationFrame(step);
  });
  slot.querySelectorAll('.rf-ring-val:not([data-rf-done])').forEach(c => {
    c.setAttribute('data-rf-done', '1');
    const fin = c.getAttribute('stroke-dashoffset'), full = c.getAttribute('stroke-dasharray');
    c.style.transition = 'none'; c.style.strokeDashoffset = full;
    c.getBoundingClientRect();
    c.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)';
    requestAnimationFrame(() => { c.style.strokeDashoffset = fin; });
  });
  slot.querySelectorAll('.rf-fill:not([data-rf-done])').forEach((b, k) => {
    b.setAttribute('data-rf-done', '1');
    const fin = b.style.width;
    b.style.transition = 'none'; b.style.width = '0%';
    b.getBoundingClientRect();
    b.style.transition = `width 0.9s cubic-bezier(.2,.8,.2,1) ${0.12 * k}s`;
    requestAnimationFrame(() => { b.style.width = fin; });
  });
}

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s.replace(' ','T'));
  const diff = Date.now() - d;
  if (diff < 86400000) return 'Today ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 172800000) return 'Yesterday';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function navTap(tab) {

  const icon = document.getElementById('navicon-' + tab);

    icon.classList.remove('bouncing');
    void icon.offsetWidth; // force reflow
    icon.classList.add('bouncing');

    // Ripple effect
    const ripple = document.createElement('div');

// ── Tab order for slide direction ────────────────────
const TAB_ORDER = ['home','trades','demo','settings'];
let prevTabIdx = 0;

function goTo(tab, skipAnim=false) {
  const newIdx  = TAB_ORDER.indexOf(tab);
  const goRight = newIdx > prevTabIdx;
  prevTabIdx    = newIdx;
  currentTab    = tab;
  ['home','trades','demo','settings'].forEach(x =>
    document.getElementById('nav-'+x).classList.toggle('active', x===tab));
  const subs = {home:'Auto-trading', trades:'Real trades', demo:'Demo mode', settings:'Account settings'};
  document.getElementById('topbar-sub').textContent =
    USER ? (USER.is_paused ? '⏸ Trading paused' : subs[tab]) : subs[tab];
  if (!USER) return;
  const content = document.getElementById('screen-content');

  const paint = () => {
    content.classList.remove('slide-in-left','slide-in-right','slide-out-left','slide-out-right');
    content.innerHTML = {home:renderHome, trades:renderTrades, demo:renderDemo, settings:renderSettings}[tab]();
    if (!skipAnim) {
      void content.offsetWidth;   // restart the animation even if the same class was just used
      content.classList.add(goRight ? 'slide-in-left' : 'slide-in-right');
    }
    document.getElementById('screen').scrollTop = 0;
    // Animate counters on demo tab
    if (tab === 'demo' && !skipAnim) setTimeout(animateDemoCounters, 50);   // DEMO PAGE: not on silent refresh
  };

  if (skipAnim) {
    paint();   // silent refresh (data reload, sort/filter change, show-more toggle) — no motion
  } else {
    // Real navigation: let the OLD page slide/fade out first, THEN swap content and
    // slide the NEW page in. Without this the old screen was replaced instantly and
    // only the incoming page faded in, which barely read as an animation at all.
    content.classList.remove('slide-in-left','slide-in-right');
    content.classList.add(goRight ? 'slide-out-left' : 'slide-out-right');
    setTimeout(paint, 140);   // matches the .slide-out-* animation duration
  }
}

// ── Animated number counter ──────────────────────────
function animateNumber(el, target, prefix='$', suffix='', duration=600) {
  if (!el) return;
  const start = 0;
  const startTime = performance.now();
  function step(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    // Ease out cubic
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = start + (target - start) * eased;
    el.textContent = prefix + current.toFixed(2) + suffix;
    if (progress < 1) requestAnimationFrame(step);
    else el.textContent = prefix + target.toFixed(2) + suffix;
  }
  requestAnimationFrame(step);
}

function animateDemoCounters() {
  // DEMO PAGE: the final, correctly formatted values are already in the
  // markup. This only replays them; every frame uses the same formatter and
  // the last frame writes the exact final text, so a number on screen can
  // never be left wrong or unformatted.
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const root = document.getElementById('dm-root');
  if (!root) return;
  const ease = t => 1 - Math.pow(1 - t, 3);
  const bal = document.getElementById('dm-bal');
  const target = bal ? Number(bal.getAttribute('data-v')) : NaN;
  if (bal && Number.isFinite(target)) {
    const finalHTML = bal.innerHTML, t0 = performance.now(), dur = 1100;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      if (p < 1) { bal.innerHTML = dmMoneyHTML(target * ease(p)); requestAnimationFrame(step); }
      else bal.innerHTML = finalHTML;
    };
    requestAnimationFrame(step);
  }
  root.querySelectorAll('[data-dm-count]').forEach(el => {
    const fin = el.textContent, tgt = Number(el.getAttribute('data-dm-count'));
    const dec = Number(el.getAttribute('data-dm-dec') || 0), suf = el.getAttribute('data-dm-suf') || '';
    if (!Number.isFinite(tgt) || tgt <= 0) return;
    const t0 = performance.now(), dur = 1000;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      if (p < 1) { el.textContent = (tgt * ease(p)).toLocaleString('en-US', { minimumFractionDigits:dec, maximumFractionDigits:dec }) + suf; requestAnimationFrame(step); }
      else el.textContent = fin;
    };
    requestAnimationFrame(step);
  });
  const line = document.getElementById('dm-line');
  if (line && line.getTotalLength) {
    const L = line.getTotalLength();
    line.style.transition = 'none'; line.style.strokeDasharray = L; line.style.strokeDashoffset = L;
    line.getBoundingClientRect();
    line.style.transition = 'stroke-dashoffset 1.6s cubic-bezier(.3,.7,.2,1)';
    requestAnimationFrame(() => { line.style.strokeDashoffset = '0'; });
    const clear = () => { line.style.strokeDasharray = ''; line.style.strokeDashoffset = ''; line.style.transition = ''; };
    setTimeout(clear, 1800);
  }
  const area = document.getElementById('dm-area');
  if (area) { area.style.transition = 'none'; area.style.opacity = '0'; area.getBoundingClientRect();
    area.style.transition = 'opacity 1s ease 0.7s'; requestAnimationFrame(() => { area.style.opacity = ''; }); }
  const ring = root.querySelector('.dm-ring-val');
  if (ring) {
    const fin = ring.getAttribute('stroke-dashoffset'), full = ring.getAttribute('stroke-dasharray');
    ring.style.transition = 'none'; ring.style.strokeDashoffset = full; ring.getBoundingClientRect();
    ring.style.transition = 'stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1) 0.2s';
    requestAnimationFrame(() => { ring.style.strokeDashoffset = fin; });
  }
  root.querySelectorAll('.dm-fill').forEach((el, k) => {
    const prop = el.hasAttribute('data-dm-flex') ? 'flexGrow' : 'width';
    const fin = el.style[prop];
    el.style.transition = 'none'; el.style[prop] = prop === 'width' ? '0%' : '0';
    el.getBoundingClientRect();
    el.style.transition = `${prop === 'width' ? 'width' : 'flex-grow'} 0.9s cubic-bezier(.2,.8,.2,1) ${0.25 + 0.08 * k}s`;
    requestAnimationFrame(() => { el.style[prop] = fin; });
  });
}

// ── Render: Demo ─────────────────────────────────────
// ── DEMO PAGE ───────────────────────────────────────
// Every figure comes straight from the server (USER.demo), the same fields
// /demostats prints. The only client-side arithmetic is presentation:
// percentages of numbers already shown, and the equity curve, which sums the
// per-trade profit_usd of the closed trades already loaded, in cents.
function dmR2(v) { const n = Number(v); return Number.isFinite(n) ? Math.round(n * 100) / 100 : 0; }
function dmSign(v) { const r = dmR2(v); return r > 0 ? '+' : (r < 0 ? '\u2212' : ''); }
function dmMoney(v, signed) {                       // "$1,234.56" / "+$1,234.56" / "−$1,234.56"
  const r = dmR2(v);
  return (signed ? dmSign(r) : (r < 0 ? '\u2212' : '')) + '$' + fmtB(Math.abs(r));
}
function dmMoneyHTML(v) {                           // hero: dollars big, cents small
  const t = dmMoney(v, false), k = t.lastIndexOf('.');
  return k < 0 ? t : `${t.slice(0, k)}<span class="c">${t.slice(k)}</span>`;
}
function dmPct(n, d, dec) { return d > 0 ? (n / d * 100).toFixed(dec) : (0).toFixed(dec); }

function dmEquity() {
  // Closed trades arrive newest-first; replay them oldest-first by id.
  const rows = (Array.isArray(CLOSED_DEMO) ? CLOSED_DEMO : [])
    .filter(t => t && Number.isFinite(Number(t.id)))
    .slice().sort((a, b) => Number(a.id) - Number(b.id));
  // Sum the exact values and round once at the end -- the same way the
  // server's SUM() then round(…, 2) produces net_realized.
  let sum = 0; const pts = [0];
  rows.forEach(t => { sum += Number(t.profit_usd) || 0; pts.push(sum); });
  return { n: rows.length, pts, total: dmR2(sum) };
}

function dmSpark(eq) {
  if (eq.n < 2) return '<div class="dm-spark-empty">Your equity curve appears after 2 closed trades</div>';
  const W = 320, H = 86, lo = Math.min(...eq.pts), hi = Math.max(...eq.pts), span = (hi - lo) || 1;
  const last = eq.pts.length - 1;
  const xy = eq.pts.map((p, i) => [2 + i * (W - 12) / last, H - 6 - (p - lo) / span * (H - 14)]);   // keep the end dot inside the card
  const line = 'M' + xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' L');
  const up = eq.total >= 0, col = up ? '#ff914d' : '#ef4444';
  const [ex, ey] = xy[last];
  return `<svg class="dm-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="dmA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <path id="dm-area" d="${line} L${ex.toFixed(1)},${H} L${xy[0][0].toFixed(1)},${H} Z" fill="url(#dmA)"/>
      <path id="dm-line" d="${line}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 3px ${up ? 'rgba(255,145,77,.8)' : 'rgba(239,68,68,.7)'})"/>
      <circle class="dm-endpt" cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3.5" fill="#fff" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="dm-spark-cap"><span>Realized P&amp;L \u00b7 ${eq.all ? 'all' : 'last'} ${eq.n} closed trade${eq.n === 1 ? '' : 's'}</span><span style="color:${dmR2(eq.total) > 0 ? 'var(--green)' : (dmR2(eq.total) < 0 ? 'var(--red)' : '#888')}">${dmMoney(eq.total, true)}</span></div>`;
}

function renderDemoStats(demo) {
  demo = demo || {};
  const start  = dmR2(demo.starting_balance || 1000);
  const total  = dmR2(demo.total_value);
  const ret    = dmR2(demo.total_return);
  const free   = dmR2(demo.free_balance);
  const locked = dmR2(demo.locked);
  const upnl   = dmR2(demo.unrealized_pnl);
  const fw = Math.max(0, Number(demo.full_wins) || 0), pw = Math.max(0, Number(demo.partial_wins) || 0);
  const be = Math.max(0, Number(demo.breakevens) || 0), ls = Math.max(0, Number(demo.losses) || 0);
  const openN = Math.max(0, Number(demo.open_trades) || 0);
  const closedN = fw + pw + be + ls;                         // exactly the trades shown below
  const wr = Math.max(0, Math.min(100, Number(demo.win_rate) || 0));
  const rp = dmR2(demo.realized_profit), rl = dmR2(demo.realized_loss), net = dmR2(demo.net_realized);

  // 1. Hero
  const retPct = start > 0 ? ret / start * 100 : 0;
  const chgCls = ret > 0 ? 'up' : (ret < 0 ? 'dn' : 'fl');
  const arrow  = ret > 0 ? '\u25b2 ' : (ret < 0 ? '\u25bc ' : '');
  const riskNames = { low:'Low risk', medium:'Medium risk', high:'High risk', contrarian:'Contrarian' };
  const eq = dmEquity();
  eq.all = eq.n === fw + pw + be + ls;             // the curve covers every closed trade
  const hero = `
    <div class="dm-card dm-hero">
      <div class="dm-shine"></div>
      <div class="dm-hd"><div class="dm-lbl">Virtual balance</div><div class="dm-tag">DEMO \u00b7 ${esc(riskNames[USER.risk_mode] || 'Medium risk').toUpperCase()}</div></div>
      <div class="dm-big" id="dm-bal" data-v="${total}">${dmMoneyHTML(total)}</div>
      <div class="dm-rt"><span class="dm-chg ${chgCls}">${arrow}${dmMoney(ret, true)} \u00b7 ${ret > 0 ? '+' : (ret < 0 ? '\u2212' : '')}${Math.abs(retPct).toFixed(2)}%</span><span>since ${dmMoney(start, false)} start</span></div>
      <div class="dm-fee">Demo results exclude trading fees</div>
      ${dmSpark(eq)}
    </div>`;

  // 2. Capital allocation. Bar shares are of free + locked (the capital);
  //    percentages are integers that always add up to exactly 100.
  const fPos = Math.max(0, free), lPos = Math.max(0, locked), cap = fPos + lPos;
  const fShare = cap > 0 ? Math.round(fPos / cap * 100) : 0;
  const lShare = cap > 0 ? 100 - fShare : 0;
  const upCol = upnl > 0 ? 'var(--green)' : (upnl < 0 ? 'var(--red)' : '#aaa');
  const alloc = `
    <div class="dm-card">
      <div class="dm-st">Capital allocation<span class="r" onclick="loadData()">\u21bb Refresh</span></div>
      <div class="dm-stack">
        ${cap > 0 ? `<div class="dm-fill" data-dm-flex style="flex-grow:${fPos};flex-basis:0;background:linear-gradient(90deg,#e85d04,#ff914d)"></div>
        <div class="dm-fill" data-dm-flex style="flex-grow:${lPos};flex-basis:0;background:repeating-linear-gradient(135deg,#7c2d12 0 5px,#9a3412 5px 10px)"></div>` : ''}
      </div>
      <div class="dm-row"><span class="dm-sw" style="background:#ff914d"></span><span class="dm-nm">Free balance</span><span class="dm-vv">${dmMoney(free, false)}${cap > 0 ? `<small>${fShare}%</small>` : ''}</span></div>
      <div class="dm-row"><span class="dm-sw" style="background:#9a3412"></span><span class="dm-nm">Locked in ${openN} trade${openN === 1 ? '' : 's'}</span><span class="dm-vv">${dmMoney(locked, false)}${cap > 0 ? `<small>${lShare}%</small>` : ''}</span></div>
      <div class="dm-row"><span class="dm-sw" style="background:${upCol};border-radius:50%"></span><span class="dm-nm">Unrealized P&amp;L${openN > 0 ? `<span class="dm-live${upnl > 0 ? ' g' : (upnl < 0 ? '' : ' n')}">LIVE</span>` : ''}</span><span class="dm-vv" style="color:${upCol}">${dmMoney(upnl, true)}</span></div>
      <div class="dm-row"><span class="dm-sw" style="background:#444"></span><span class="dm-nm">Starting balance</span><span class="dm-vv">${dmMoney(start, false)}</span></div>
      <div class="dm-tot"><span>Total value</span><span>${dmMoney(total, false)}</span></div>
    </div>`;

  // 3. Performance
  const C = 213.63;                                          // 2 * PI * 34
  const ring = `<svg width="96" height="96" viewBox="0 0 84 84" style="flex:0 0 96px" aria-hidden="true">
      <defs><linearGradient id="dmG" x1="0" x2="1"><stop offset="0" stop-color="#e85d04"/><stop offset="1" stop-color="#ffb27a"/></linearGradient></defs>
      <circle cx="42" cy="42" r="34" fill="none" stroke="#1e1e1e" stroke-width="7"/>
      ${wr > 0 ? `<circle class="dm-ring-val" cx="42" cy="42" r="34" fill="none" stroke="url(#dmG)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${(C * (1 - wr / 100)).toFixed(2)}" transform="rotate(-90 42 42)" style="filter:drop-shadow(0 0 4px rgba(232,93,4,.6))"/>` : ''}
      <text x="42" y="44" text-anchor="middle" fill="#fff" font-size="16" font-weight="800" data-dm-count="${wr}" data-dm-dec="1" data-dm-suf="%">${wr.toFixed(1)}%</text>
      <text x="42" y="56" text-anchor="middle" fill="#777" font-size="8">win rate</text>
    </svg>`;
  const OUT = [
    { k:'fw', n:fw, col:'#22c55e', bg:'rgba(34,197,94,0.12)', name:'Full wins',    sub:'all targets hit',  ic:'<path d="M5 12.5 10 17 19 7"/>' },
    { k:'pw', n:pw, col:'#eab308', bg:'rgba(234,179,8,0.12)', name:'Partial wins', sub:'closed in profit', ic:'<circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>' },
    { k:'be', n:be, col:'#60a5fa', bg:'rgba(96,165,250,0.12)', name:'Breakeven',   sub:'net zero',         ic:'<path d="M6 9.5h12M6 14.5h12"/>' },
    { k:'ls', n:ls, col:'#ef4444', bg:'rgba(239,68,68,0.12)', name:'Losses',       sub:'closed at a loss', ic:'<path d="M7 7l10 10M17 7 7 17"/>' },
  ];
  const seg = closedN > 0
    ? OUT.filter(o => o.n > 0).map(o => `<div class="dm-fill" data-dm-flex style="flex-grow:${o.n};flex-basis:0;background:${o.col}"></div>`).join('')
    : '';
  const lines = OUT.map(o => `
      <div class="dm-lr">
        <div class="ic" style="background:${o.bg};color:${o.col}"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${o.ic}</svg></div>
        <div class="n">${o.name}<small>${o.sub}</small></div>
        <div class="dm-bar"><i class="dm-fill" style="width:${dmPct(o.n, closedN, 2)}%;background:${o.col}"></i></div>
        <div class="c"><span data-dm-count="${o.n}">${o.n.toLocaleString('en-US')}</span><small>${dmPct(o.n, closedN, 1)}%</small></div>
      </div>`).join('');
  const perf = `
    <div class="dm-card">
      <div class="dm-st">Performance</div>
      <div class="dm-perf">${ring}
        <div>
          <div class="dm-perf-n" data-dm-count="${closedN}">${closedN.toLocaleString('en-US')}</div>

          <div style="font-size:12px;color:var(--red)">${ls.toLocaleString('en-US')} at a loss</div>` : '<div style="font-size:12px;color:#666;margin-top:6px">No closed trades yet</div>'}
        </div>
      </div>
      <div class="dm-seg">${seg}</div>
      ${lines}
      <div class="dm-open"><span class="dm-pulse${openN > 0 ? '' : ' off'}"></span>Open positions<span style="margin-left:auto;font-weight:800;color:#fff;font-variant-numeric:tabular-nums">${openN.toLocaleString('en-US')}</span></div>
    </div>`;

  // 4. Realized P&L. Bars are scaled to the larger of the two amounts.
  const rpAbs = Math.abs(rp), rlAbs = Math.abs(rl), mx = Math.max(rpAbs, rlAbs);
  const netCol = net > 0 ? 'var(--green)' : (net < 0 ? 'var(--red)' : '#fff');
  const real = `
    <div class="dm-card">
      <div class="dm-st">Realized P&amp;L</div>
      <div class="dm-pl"><div class="t"><span>Realized profit</span><b style="color:var(--green)">${dmMoney(rpAbs, true)}</b></div>
        <div class="dm-bar" style="height:8px"><i class="dm-fill" style="width:${mx > 0 ? (rpAbs / mx * 100).toFixed(2) : 0}%;background:linear-gradient(90deg,#15803d,#22c55e)"></i></div></div>
      <div class="dm-pl" style="margin-top:12px"><div class="t"><span>Realized loss</span><b style="color:var(--red)">${dmMoney(-rlAbs, true)}</b></div>
        <div class="dm-bar" style="height:8px"><i class="dm-fill" style="width:${mx > 0 ? (rlAbs / mx * 100).toFixed(2) : 0}%;background:linear-gradient(90deg,#991b1b,#ef4444)"></i></div></div>
      <div class="dm-tot" style="margin-top:14px"><span>Net realized</span><span style="color:${netCol}">${dmMoney(net, true)}</span></div>
    </div>`;

  return `<div id="dm-root">${hero}${alloc}${perf}${real}</div>`;
}

          Changing this resets your demo and clears history, so every statistic is measured from one starting point.
        </div>
      </div>
      <div class="input-row" style="margin-bottom:8px;border-color:rgba(167,139,250,0.2)">
        <div class="input-lbl" style="color:rgba(167,139,250,0.6)">Demo trade amount</div>
        <div class="amount-display"><span class="amount-curr">$</span><span class="amount-val" id="demo-amt" style="color:var(--purple)">${USER.demo_amount || 100}</span></div>
        <div class="amount-btns">
          ${[10,25,50,100].map(v=>`<div class="amount-btn" onclick="setDemoAmount(${v})">$${v}</div>`).join('')}
        </div>
      </div>
      <div class="risk-card" style="margin-bottom:8px">
        <div class="risk-label">Demo risk mode</div>
        <div class="risk-btns">
          <button class="risk-btn ${USER.risk_mode==='low'?'active':''}" data-mode="low" onclick="setRisk('low')"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:1px;vertical-align:1px"></span>Low</button>
          <button class="risk-btn ${USER.risk_mode==='medium'?'active':''}" data-mode="medium" onclick="setRisk('medium')"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#eab308;margin-right:1px;vertical-align:1px"></span>Medium</button>
          <button class="risk-btn ${USER.risk_mode==='high'?'active':''}" data-mode="high" onclick="setRisk('high')"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:1px;vertical-align:1px"></span>High</button>
        </div>
        <!-- CONTRARIAN: delete this div to remove the experimental mode -->
        <div class="risk-btns" style="margin-top:6px">
          <button class="risk-btn ${USER.risk_mode==='contrarian'?'active':''}" data-mode="contrarian" onclick="setRisk('contrarian')"><span style="display:inline-flex;vertical-align:-2px;width:12px;height:12px;margin-right:2px"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2.5V5.5H10"/></svg></span>Contrarian <span style="opacity:.6;font-size:10px">· experimental</span></button>
        </div>
        <div class="risk-desc">${RISK_DESCS[USER.risk_mode] || RISK_DESCS.medium}</div>
      </div>
      <div class="section-header" style="padding:0 0 10px"><div class="section-title">Open demo trades (${openDemo.length})</div></div>
      ${openDemo.length ? `
        ${openDemo.slice(0, showAllOpen ? openDemo.length : 5).map(t => {
          const upnl      = t.upnl != null ? t.upnl : null;
          const upnlPos   = upnl >= 0;
          const partial   = parseFloat(t.partial_closed || 0);
          const amount    = parseFloat(t.amount || 0);
          const tpHit     = partial > 0;
          const tpsArr    = Array.isArray(t.tps) ? t.tps : [];
          const riskMode  = t.risk_mode || 'high';
          // Calculate splits using the trade's actual risk_mode (mirrors get_splits in trader.py)
          // Mirrors get_splits() in trader.py — keep in sync if the strategy changes.
          function getSplits(numTps, mode) {
            if (numTps === 0) return [];
            if (numTps === 1) return [1.0];
            const n = Math.min(numTps, 5);
            if (mode === 'low') {
              const t = {2:[0.60,0.40], 3:[0.60,0.30,0.10],
                         4:[0.40,0.30,0.20,0.10], 5:[0.40,0.30,0.20,0.00,0.10]};
              return t[n] || t[5];
            }
            if (mode === 'medium') {
              const t = {2:[0.30,0.70], 3:[0.30,0.30,0.40],
                         4:[0.40,0.30,0.20,0.10], 5:[0.10,0.50,0.30,0.00,0.10]};
              return t[n] || t[5];
            }
            if (mode === 'contrarian') return [1.0];   // CONTRARIAN: single target
            const t = {2:[0.20,0.80], 3:[0.20,0.40,0.40],
                       4:[0.10,0.40,0.40,0.10], 5:[0.00,0.50,0.20,0.20,0.10]};
            return t[n] || t[5];
          }
          let tpLabel = '';
          if (tpHit && tpsArr.length > 0) {
            const splits = getSplits(tpsArr.length, riskMode);
            let cumulative = 0, lastHitIdx = 0;
            for (let i = 0; i < splits.length && i < tpsArr.length; i++) {
              cumulative += amount * splits[i];
              if (partial >= cumulative - 0.01) lastHitIdx = i + 1;
            }
            tpLabel = lastHitIdx > 0 ? `TP${lastHitIdx} hit · ` : '';
          }
          return `
          <div class="trade-card ${upnl > 0 ? 'status-profit' : upnl < 0 ? 'status-loss' : 'status-open'}" >
            <div class="trade-card-header" style="width:100%;display:flex;align-items:center;justify-content:space-between">
              <div style="min-width:0;flex:1">
                <div class="trade-coin">${t.symbol} <span class="badge ${t.direction==='LONG'?'long':'short'}">${t.direction}</span></div>
                <div class="trade-detail" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">x${t.leverage} &middot; Entry $${parseFloat(t.entry).toLocaleString()} &middot; ${tpLabel}${fmtDate(t.opened_at)}</div>
              </div>
              <div style="text-align:right;display:flex;align-items:center;gap:10px;flex-shrink:0">
                ${upnl != null
                  ? `<div><div class="trade-pnl ${upnlPos?'pos':'neg'}">${upnlPos?'+':'-'}$${fmt(upnl)}</div>
                     <div class="trade-pct" style="color:${upnlPos?'var(--green)':'var(--red)'}">${upnlPos?'▲':'▼'} live</div></div>`
                  : `<div><div class="trade-pnl" style="color:var(--text3)">OPEN</div>
                     <div class="trade-pct">—</div></div>`
                }
                <!-- MANUAL CLOSE: delete this button to remove the feature -->
                ${t.id != null ? `
                <button onclick="closeDemoTrade(${t.id},'${String(t.symbol).replace(/'/g,"")}')"
                        title="Close this trade"
                        style="background:transparent;border:0.5px solid var(--red);color:var(--red);
                               width:26px;height:26px;line-height:1;border-radius:50%;
                               font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;
                               display:flex;align-items:center;justify-content:center;padding:0">&times;</button>` : ''}
              </div>
            </div>
          </div>`;
        }).join('')}
        ${openDemo.length > 5 ? `
        <div style="text-align:center;padding:8px 0 4px;cursor:pointer;font-size:12px;color:var(--orange)"
             onclick="showAllOpen=!showAllOpen;goTo('demo',true)">
          ${showAllOpen ? '▲ Show less' : `▼ View all ${openDemo.length} open trades`}
        </div>` : ''}
      ` : `<div class="empty-state">No open demo trades</div>`}
      ${closedDemo.length ? (() => {
        // ── history sort + filter ──
        // Classification mirrors the badge logic below exactly, so a trade
        // shown as a win is always the same set the "Wins" filter selects.
        const EPS_F = 0.005;
        const isWin  = t => t.status === 'TP_HIT' || parseFloat(t.profit_usd || 0) > EPS_F;
        const isLoss = t => t.status !== 'TP_HIT' && parseFloat(t.profit_usd || 0) < -EPS_F;
        let hist = closedDemo.slice();
        if (histFilter === 'wins')   hist = hist.filter(isWin);
        if (histFilter === 'losses') hist = hist.filter(isLoss);
        const ts = t => {
          const d = new Date(String(t.closed_at || t.opened_at || '').replace(' ', 'T'));
          return isNaN(d) ? 0 : d.getTime();
        };
        const pf = t => parseFloat(t.profit_usd || 0);
        if (histSort === 'newest') hist.sort((a, b) => ts(b) - ts(a));
        if (histSort === 'oldest') hist.sort((a, b) => ts(a) - ts(b));
        if (histSort === 'profit') hist.sort((a, b) => pf(b) - pf(a));
        if (histSort === 'loss')   hist.sort((a, b) => pf(a) - pf(b));
        const selCss = 'background:var(--bg3);border:0.5px solid var(--border);color:var(--text);'
                     + 'border-radius:var(--radius-sm);padding:6px 8px;font-size:11px;'
                     + 'font-family:inherit;outline:none;flex:1;min-width:0';
        return `
      <div class="section-header" style="padding:8px 0 10px"><div class="section-title">Demo history (${hist.length}${hist.length !== closedDemo.length ? ` of ${closedDemo.length}` : ''})</div></div>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <select style="${selCss}" onchange="histSort=this.value;goTo('demo',true)">
          <option value="newest" ${histSort==='newest'?'selected':''}>Newest first</option>
          <option value="oldest" ${histSort==='oldest'?'selected':''}>Oldest first</option>
          <option value="profit" ${histSort==='profit'?'selected':''}>Highest profit</option>
          <option value="loss"   ${histSort==='loss'  ?'selected':''}>Biggest loss</option>
        </select>
        <select style="${selCss}" onchange="histFilter=this.value;goTo('demo',true)">
          <option value="all"    ${histFilter==='all'   ?'selected':''}>All trades</option>
          <option value="wins"   ${histFilter==='wins'  ?'selected':''}>Wins only</option>
          <option value="losses" ${histFilter==='losses'?'selected':''}>Losses only</option>
        </select>
      </div>
      ${hist.length === 0 ? `<div class="empty-state">No trades match this filter</div>` : `
      <div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px">
        ${hist.slice(0, showAllClosed ? hist.length : 10).map(t => {
          const profit      = parseFloat(t.profit_usd || 0);
          const partial     = parseFloat(t.partial_closed || 0);
          // Same epsilon as the label below, so the amount's colour and sign
          // never contradict the badge (a residue value like 5e-17 must render
          // as a neutral $0.00 breakeven, not a green +$0.00).
          const isPos       = profit >  0.005;
          const isNeg       = profit < -0.005;
          // Classification must mirror the backend exactly:
          //   full win  = all TPs hit (TP_HIT)
          //   partial   = closed with net profit  (> +0.005)
          //   breakeven = closed at net zero      (within +/- 0.005)
          //   loss      = closed with net loss    (< -0.005)
          // Uses an epsilon (not ==0) because profit_usd accumulates across
          // legs and float addition leaves sub-cent residue.
          const EPS = 0.005;
          let lbl, lblColor;
          if (t.status === 'TP_HIT') {
            lbl = '<span style="display:inline-flex;vertical-align:-1px;width:10px;height:10px;margin-right:3px"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%"><path d="M3 8.5 6.5 12 13 4.5"/></svg></span>Full win'; lblColor = 'var(--green)';
          } else if (profit > EPS) {
            lbl = '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#eab308;margin-right:4px;vertical-align:1px"></span>Partial win'; lblColor = '#eab308';
          } else if (profit >= -EPS) {
            lbl = '<span style="display:inline-flex;vertical-align:-1px;width:10px;height:10px;margin-right:3px"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%"><path d="M3.5 6.5h9"/><path d="M3.5 9.5h9"/></svg></span>Breakeven'; lblColor = '#60a5fa';
          } else {
            lbl = '<span style="display:inline-flex;vertical-align:-1px;width:10px;height:10px;margin-right:3px"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%"><path d="M4 4 12 12"/><path d="M12 4 4 12"/></svg></span>Loss'; lblColor = 'var(--red)';
          }
          // ADMIN TOOLS: closed_manually is 1 when the user closed the trade
          // themselves and 2 when support closed it early. The two are
          // different events so they get different wording, and the second
          // shows the reason rather than leaving the user to guess.
          const cm = Number(t.closed_manually);
          const closeTag = cm === 1
            ? ' <span style="color:var(--text3)">· closed manually</span>'
            : cm === 2
              ? ' <span style="color:#eab308">· closed early by MRRIK</span>'
              : '';
          const closeNote = (cm === 2 && t.close_reason)
            ? `<div style="font-size:11px;color:var(--text3);margin-top:3px;line-height:1.35">${esc(t.close_reason)}</div>`
            : '';
          return `
          <div class="trade-hist">
            <div>
              <div class="hist-coin">${t.symbol} <span class="badge ${t.direction==='LONG'?'long':'short'}">${t.direction}</span></div>
              <div class="hist-date" style="color:${lblColor}">${lbl}${closeTag} &middot; ${fmtDate(t.closed_at)}</div>
              ${closeNote}
            </div>
            <div>
              <div class="hist-pnl ${isPos?'win':isNeg?'loss':''}" style="${!isPos&&!isNeg?'color:#60a5fa':''}">${isPos?'+':isNeg?'-':''}$${fmt(profit)}</div>
              <div class="hist-pct">${isPos?'+':''}${parseFloat(t.profit_pct||0).toFixed(2)}%</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      ${hist.length > 10 ? `
      <div style="text-align:center;padding:4px 0 12px;cursor:pointer;font-size:12px;color:var(--orange)"
           onclick="showAllClosed=!showAllClosed;goTo('demo',true)">
        ${showAllClosed ? '▲ Show less' : `▼ View all ${hist.length} trades`}
      </div>` : ''}`}
      `; })() : ''}
    </div>`;
}

function srIcon(p) {

  power:   srIcon('<path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>'),

  plane:   srIcon('<path d="M21 4 3 11l6 2 2 6 3-4 4 3z"/><path d="m9 13 8-6"/>'),

};
const SR_CHEV = '<span class="sr-chev">\u203a</span>';
function srRow(icon, title, sub, right, onclick, red) {
  return `<div class="sr${onclick ? '' : ' static'}"${onclick ? ` onclick="${onclick}"` : ''}>
      <div class="sr-ic${red ? ' red' : ''}">${SR_I[icon]}</div>
      <div class="sr-tx"><div class="sr-t${red ? ' red' : ''}">${title}</div><div class="sr-s">${sub}</div></div>
      <div class="sr-right">${right}</div>
    </div>`;
}
function srOpenTg(url) {
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
}
function srScrollRenew() {
  const el = document.getElementById('renew-card');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function srAgo(ts) {
  if (!ts) return 'Tap to reload';
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return 'Updated just now';
  if (m === 1) return 'Updated 1 min ago';
  if (m < 60) return `Updated ${m} min ago`;
  return `Updated ${Math.floor(m / 60)} h ago`;
}

function renderAccountRows() {
  const sub = USER.subscription || {};
  const dl = Number(sub.days_left);
  let subLine, badge;
  if (!USER.is_active) {
    subLine = '<span class="sr-dot" style="background:var(--red)"></span>Not activated';
    badge = '<span class="sr-badge bad">INACTIVE</span>';
  } else if (sub.is_lifetime) {
    subLine = '<span class="sr-dot" style="background:var(--green)"></span>Lifetime access';
    badge = '<span class="sr-badge ok">ACTIVE</span>';
  } else if (Number.isFinite(dl) && dl <= 0) {
    subLine = '<span class="sr-dot" style="background:var(--red)"></span>Expired \u00b7 renew to continue';
    badge = '<span class="sr-badge bad">EXPIRED</span>';
  } else if (Number.isFinite(dl) && dl <= 7) {
    subLine = `<span class="sr-dot" style="background:#eab308"></span>${dl} day${dl === 1 ? '' : 's'} left \u00b7 until ${refShort(sub.expires)}`;
    badge = '<span class="sr-badge amb">ENDING</span>';
  } else {
    subLine = `<span class="sr-dot" style="background:var(--green)"></span>${sub.expires ? 'Until ' + refShort(sub.expires) : 'Active'}`;
    badge = '<span class="sr-badge ok">ACTIVE</span>';
  }

  const hasKey = !!USER.has_api_key;
  const binSub = hasKey ? 'Connected \u00b7 trading enabled' : '<span style="color:#ff914d">Required for real trading</span>';
  const binRight = hasKey ? '<span class="sr-badge ok">\u2713 ON</span>' : '<span class="qc-chip">Connect</span>';
  const binClick = hasKey ? '' : "openBotCommand('connect')";

  const d = USER.demo || {};
  let demoSub = 'Practise with virtual funds';
  if (USER.is_demo) {
    const dv = Number(d.total_value) || 0, start = Number(d.starting_balance) || 0;
    const ret = Number.isFinite(Number(d.total_return)) ? Number(d.total_return) : dv - start;
    let chg = '';
    if (start) {
      const pct = ret / start * 100, up = ret >= 0;
      const col = Math.abs(ret) < 0.005 ? '#888' : (up ? 'var(--green)' : 'var(--red)');
      chg = ` \u00b7 <span style="color:${col}">${up ? '+' : '\u2212'}${Math.abs(pct).toFixed(1)}%</span>`;
    }
    demoSub = `$${fmtB(dv)}${chg}`;
  }

  return `<div class="sr-grp">
      ${srRow('shield', 'Subscription', subLine, badge + SR_CHEV, 'srScrollRenew()')}
      ${srRow('link', 'Binance API', binSub, binRight, binClick)}
      ${srRow('flask', 'Demo mode', demoSub, `<div class="qc-sw ${USER.is_demo ? 'on' : ''}"></div>`, 'toggleDemo()')}
    </div>`;
}

function renderSettings() {
  const sub = USER.subscription || {};
  const dl = sub.days_left;
  const isLifetime = sub.is_lifetime;
  const isActive = USER.is_active;

  // Subscription card styling
  let subBg, subColor, subBorder, subIcon, subText, subSub;
  if (!isActive) {
    subBg = 'var(--red-dim)'; subColor = 'var(--red)'; subBorder = 'rgba(239,68,68,0.2)';
    subIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%"><circle cx="8" cy="8" r="5.5"/><path d="M4.1 4.1 11.9 11.9"/></svg>'; subText = 'Inactive'; subSub = 'Contact support to activate';
  } else if (isLifetime) {
    subBg = 'rgba(234,179,8,0.08)'; subColor = '#eab308'; subBorder = 'rgba(234,179,8,0.2)';
    subIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%"><path d="M3 12 3.5 4 6 7.5 8 3 10 7.5 12.5 4 13 12 Z"/></svg>'; subText = 'Lifetime Access'; subSub = 'Never expires';
  } else if (dl <= 0) {
    subBg = 'var(--red-dim)'; subColor = 'var(--red)'; subBorder = 'rgba(239,68,68,0.2)';
